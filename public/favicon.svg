<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- AliDeals Red-Orange Gradient -->
    <linearGradient id="aliBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C5C" />
      <stop offset="50%" stop-color="#E62E04" />
      <stop offset="100%" stop-color="#B81B00" />
    </linearGradient>

    <!-- Golden Deal Sparkle Gradient -->
    <linearGradient id="goldSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF587" />
      <stop offset="60%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#aliBg)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Shopping Bag Structure -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bag Main Body with Frosted Fill -->
    <path
      d="M42 26 L28 44 V92 C28 97.5 32.5 102 38 102 H90 C95.5 102 100 97.5 100 92 V44 L86 26 Z"
      fill="rgba(255, 255, 255, 0.15)"
      stroke-width="7"
    />
    
    <!-- Bag Horizontal Fold Line -->
    <line x1="28" y1="44" x2="100" y2="44" stroke-width="6" />
    
    <!-- Bag Handle Arc -->
    <path
      d="M50 54 C50 68 56 74 64 74 C72 74 78 68 78 54"
      stroke-width="7"
    />
  </g>

  <!-- Golden 4-Point Deal Sparkle -->
  <path
    d="M98 14 L100.8 22.8 L110 25.5 L100.8 28.2 L98 37 L95.2 28.2 L86 25.5 L95.2 22.8 Z"
    fill="url(#goldSparkle)"
    stroke="#FFFFFF"
    stroke-width="1.5"
  />
</svg>
